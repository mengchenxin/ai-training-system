name: keepalive

# 目的：Render 免费 Web Service 15 分钟无请求会休眠，下次访问冷启动约 50 秒。
# 定时 ping 健康检查端点可让实例保持活跃，答辩/审阅期间不至于点开就白屏。
#
# 使用前需在仓库 Settings → Secrets and variables → Actions 添加：
#   BACKEND_URL = https://ai-training-server-xxxx.onrender.com   （不要带 /api）
#
# 注意：GitHub 定时任务在仓库 60 天无提交后会自动停用，且触发时间有 5–15 分钟延迟。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::未配置 BACKEND_URL secret，跳过本次保活"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BACKEND_URL/api/health" || echo "000")
          echo "GET $BACKEND_URL/api/health -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::后端未就绪 (HTTP $code)，冷启动期间属正常，下个周期会重试"
          fi
