<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 培训计划管理系统</title>
    <style>
      /* 首屏占位：Vue 挂载后会整体替换 #app 的内容 */
      html, body { margin: 0; height: 100%; }
      #app { height: 100%; }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        color: #1f2937;
      }
      .boot-logo {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px;
      }
      .boot-title { font-size: 16px; margin: 0 0 8px; }
      .boot-tip { font-size: 13px; color: #6b7280; margin: 0; line-height: 1.8; text-align: center; }
      .boot-bar {
        margin-top: 20px;
        width: 160px; height: 3px;
        background: #e5e7eb;
        border-radius: 2px;
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        width: 40%; height: 100%;
        background: #2563eb;
        border-radius: 2px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-logo">AI</div>
        <p class="boot-title">AI 培训计划管理系统</p>
        <p class="boot-tip">
          首次访问需唤醒云端服务，约 30–60 秒<br />请稍候，不要关闭页面
        </p>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
